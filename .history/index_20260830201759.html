<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseBeat</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;600&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap">
    <style>
        /*=The heartbeat animation lab and no javascript is gonna be added because I am trash at that ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body,
        h1,
        h2,
        h3,
        h4,
        p,
        figure {
            margin: 0
        }

        /* ---- light pallete this is the ecg animation paper---*/
        :root {
            --paper: #FBF1EE;
            --card: #FFFAF8;
            --ink: #1F1418;
            --dim: #6A555D;
            --line: #E3CDC7;
            --oxy: #D6304A;
            --deoxy: #2E6E8E;
            --good: #2F7A55;
            --grid: rgba(214, 48, 74, 0.1);
            --grid2: rgba(214, 48, 74, .2);
            --beat: .83s;
            --disp: "Big Shoulders Display", "Arial Narrow", sans-serif;
            --body: "Newsreader", Georgia, serif;
            --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
        }

        /*--dark mode pallete*/
        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --paper: #0C0A0E;
                --card: #171220;
                --ink: #F2E6E9;
                --dim: #AC9BA4;
                --line: #2D2431;
                --oxy: #FF5A6E;
                --deoxy: #62B6DC;
                --good: #5FCF9A;
                --grid: rgba(255, 90, 110, .06);
                --grid2: rgba(255, 90, 110, .13);
            }
        }

        :root[data-theme="dark"] {
            --paper: #0C0A0E;
            --card: #171220;
            --ink: #F2E6E9;
            --dim: #AC9BA4;
            --line: #2D2431;
            --oxy: #FF5A6E;
            --deoxy: #62B6DC;
            --good: #5FCF9A;
            --grid: rgba(255, 90, 110, .06);
            --grid2: rgba(255, 90, 110, .13);
        }

        body {
            background-color: var(--paper);
            background-image:
                repeating-linear-gradient(to right, var(--grid2) 0 1px, transparent 1px 40px),
                repeating-linear-gradient(to bottom, var(--grid2) 0 1px, transparent 1px 40px),
                repeating-linear-gradient(to right, var(--grid) 0 1px, transparent 1px 8px),
                repeating-linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px 8px);
            color: var(--ink);
            font: 17px/1.6 var(--body);
            padding: 0 20px 60px;
        }

        h1,
        h2,
        h3 {
            font-family: var(--disp);
            font-weight: 800;
            line-height: .95;
            text-transform: uppercase;
            text-wrap: balance
        }

        .wrap {
            max-width: 1000px;
            margin: 0 auto
        }

        section {
            padding: 56px 0;
            border-top: 1px solid var(--line)
        }

        h2 {
            font-size: clamp(30px, 5vw, 50px)
        }

        .eyebrow {
            font: 600 11px/1 var(--mono);
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--dim);
            ;
            margin-bottom: 10px
        }

        .lede {
            color: var(--dim);
            max-width: 60ch;
            margin-top: 12px;
            font-weight: 300;
            font-size: 18px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 4px
        }

        /* hero */
        header {
            display: grid;
            grid-template-columns: 1.1fr.9fr;
            gap: 40px;
            align-items: center;
            padding: 70px 0 56px
        }

        h1 {
            font-size: clamp(56px, 11vw, 130px);
            letter-spacing: -1.0em
        }

        h1 span {
            color: var(--oxy);
            display: block
        }

        .heart {
            width: min(100%, 300px);
            margin: 0 auto;
            display: block;
            animation: thump var(--beat) infinite
        }

        @keyframes thump {

            0%,
            100% {
                transform: scale(1)
            }

            8% {
                transform: scale(1.08)
            }

            17% {
                transform: scale(1)
            }

            26% {
                transform: scale(1.04)
            }

            36% {
                transform: scale(1)
            }
        }

        /*rate switch so the four radios that basically retune the entire page */
        .sr {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0
        }

        .rates {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px
        }

        .rates label {
            font: 600 11px/1 var(--mono);
            letter-spacing: .1em;
            text-transform: uppercase;
            padding: 11px 16px;
            border: 1px solid var(--line);
            border-padding: 11px 16px;
            border: 1px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
            color: var(--dim)
        }

        .rates label:hover {
            border-color: var(--oxy);
            color: var(--ink)
        }

        .sr:focus-visible+label {
            outline: 2px solid var(--oxy);
            outline-offset: 2px
        }

        body:has(#r1:checked) {
            --beat: 1.25s
        }

        body:has(#r2:checked) {
            --beat: 0.83s
        }

        body:has(#r3:checked) {
            --beat: 0.45s
        }

        body:has(#r4:checked) {
            --beat: 0.34s
        }

        body:has(#r1:checked)[for=r1],
        body:has(#r2:checked)[for=r2],
        body:has(#r3:checked)[for=r3],
        body:has(#r4:checked)[for=r4] {
            background: var(--oxy);
            border-color: var(--oxy);
            color: #fff
        }

        .bpm {
            font-family: var(--disp);
            font-weight: 800;
            font-size: 56px;
            color: var(--oxy);
            line-height: 1
        }

        .bpm b {
            display: none
        }

        .bpm small {
            font: 500 13px/1 var(--mono);
            color: var(--dim);
            margin-left: 6px
        }

        body:has(#r1:checked) .b1,
        body:has(#r2:checked) .b2,
        body:has(#r3:checked) .b3,
        body:has(#r4:checked) .b4 {
            display: inline
        }

        /*ECG cycle*/
        .strip {
            overflow: hidden;
            padding: 0;
            margin-top: 22px
        }

        .strip svg {
            width: 100%;
            height: 150px;
            display: block
        }

        .strip g {
            animation: roll var(--beat) linear infinite
        }

        @keyframes roll {
            to {
                transform: translateX(-100px)
            }
        }

        /*DIAGRAM so 7 clickable parts and its driven by the radio*/
        .lab {
            display: grid;
            grid-template-columns: 1.45fr .85fr;
            gap: 24px;
            align-items: start;
            margin-top: 26px
        }

        .diagram {
            width: 100%;
            height: auto;
            padding: 12px
        }

        .parts {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 18px
        }

        .parts label {
            font: 600 10.5px/1 var(--mono);
            letter-spacing: .1em;
            text-transform: uppercase;
            padding: 9px 13px;
            border: 1px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
            color: var(--dim)
        }

        .parts label:hover {
            border-color: var(--oxy);
            color: var(--ink)
        }

        .info {
            display: none;
            padding: 22px
        }

        .info h3 {
            font-size: 29px;
            color: var(--oxy)
        }

        .info p {
            color: var(--dim);
            font-size: 16px;
            margin-top: 9px
        }

        .info em {
            display: block;
            font: 400 13px/1.5 var(--mono);
            font-style: normal;
            color: var(--ink);
            margin-top: 14px;
            padding-left: 12px;
            border-left: 3px solid var(--oxy)
        }

        /*SHOW the chosen card*/
        body:has(#ra:checked) .i-ra,
        body:has(#rv:checked) .i-rv,
        body:has(#la:checked) .i-la,
        body:has(#lv:checked) .i-lv,
        body:has(#lu:checked) .i-lu,
        body:has(#bo:checked) .i-bo,
        body:has(#va:checked) .i-va {
            display: block
        }

        body:has(#ra:checked) [for=ra],
        body:has(#rv:checked) [for=rv],
        body:has(#la:checked) [for=la],
        body:has(#lv:checked) [for=lv],
        body:has(#lu:checked) [for=lu],
        body:has(#bo:checked) [for=bo],
        body:has(#va:checked) [for=va] {
            background: var(--oxy);
            border-color: var(--oxy);
            color: #fff
        }

        body:has(#ra:checked) .s-ra,
        body:has(#rv:checked) .s-rv,
        body:has(#la:checked) .s-la,
        body:has(#lv:checked) .s-lv,
        body:has(#lu:checked) .s-lu,
        body:has(#bo:checked) .s-bo,
        body:has(#va:checked) .s-va {
            stroke: var(--ink);
            stroke-width: 7
        }

        .diagram text {
            font-family: var(--disp);
            font-weight: 700;
            fill: var(--ink)
        }

        tube {
            fill: none;
            stroke-dasharray: 13 27;
            animation: flow calc(var(--beat)*2.4) linear infinite
        }

        @keyframes flow {
            to {
                stroke-dashoffset: -40
            }
        }

        /*FACTS*/
