<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseBeat</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;600&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap">
    <style>
        /*=The heartbeat animation lab and no javascript is gonna be added because I am trash at that ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body,
        h1,
        h2,
        h3,
        h4,
        p,
        figure {
            margin: 0
        }

        /* ---- light pallete this is the ecg animation paper---*/
        :root {
            --paper: #FBF1EE;
            --card: #FFFAF8;
            --ink: #1F1418;
            --dim: #6A555D;
            --line: #E3CDC7;
            --oxy: #D6304A;
            --deoxy: #2E6E8E;
            --good: #2F7A55;
            --grid: rgba(214, 48, 74, 0.1);
            --grid2: rgba(214, 48, 74, .2);
            --beat: .83s;
            --disp: "Big Shoulders Display", "Arial Narrow", sans-serif;
            --body: "Newsreader", Georgia, serif;
            --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
        }

        /*--dark mode pallete*/
        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --paper: #0C0A0E;
                --card: #171220;
                --ink: #F2E6E9;
                --dim: #AC9BA4;
                --line: #2D2431;
                --oxy: #FF5A6E;
                --deoxy: #62B6DC;
                --good: #5FCF9A;
                --grid: rgba(255, 90, 110, .06);
                --grid2: rgba(255, 90, 110, .13);
            }
        }

        :root[data-theme="dark"] {
            --paper: #0C0A0E;
            --card: #171220;
            --ink: #F2E6E9;
            --dim: #AC9BA4;
            --line: #2D2431;
            --oxy: #FF5A6E;
            --deoxy: #62B6DC;
            --good: #5FCF9A;
            --grid: rgba(255, 90, 110, .06);
            --grid2: rgba(255, 90, 110, .13);
        }

        body {
            background-color: var(--paper);
            background-image:
                repeating-linear-gradient(to right, var(--grid2) 0 1px, transparent 1px 40px),
                repeating-linear-gradient(to bottom, var(--grid2) 0 1px, transparent 1px 40px),
                repeating-linear-gradient(to right, var(--grid) 0 1px, transparent 1px 8px),
                repeating-linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px 8px);
            color: var(--ink);
            font: 17px/1.6 var(--body);
            padding: 0 20px 60px;
        }

        h1,
        h2,
        h3 {
            font-family: var(--disp);
            font-weight: 800;
            line-height: .95;
            text-transform: uppercase;
            text-wrap: balance
        }

        .wrap {
            max-width: 1000px;
            margin: 0 auto
        }

        section {
            padding: 56px 0;
            border-top: 1px solid var(--line)
        }

        h2 {
            font-size: clamp(30px, 5vw, 50px)
        }

        .eyebrow {
            font: 600 11px/1 var(--mono);
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--dim);
            ;
            margin-bottom: 10px
        }

        .lede {
            color: var(--dim);
            max-width: 60ch;
            margin-top: 12px;
            font-weight: 300;
            font-size: 18px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 4px
        }

        /* hero */
        header {
            display: grid;
            grid-template-columns: 1.1fr.9fr;
            gap: 40px;
            align-items: center;
            padding: 70px 0 56px
        }

        h1 {
            font-size: clamp(56px, 11vw, 130px);
            letter-spacing: -1.0em
        }

        h1 span {
            color: var(--oxy);
            display: block
        }

        .heart {
            width: min(100%, 300px);
            margin: 0 auto;
            display: block;
            animation: thump var(--beat) infinite
        }

        @keyframes thump {

            0%,
            100% {
                transform: scale(1)
            }

            8% {
                transform: scale(1.08)
            }

            17% {
                transform: scale(1)
            }

            26% {
                transform: scale(1.04)
            }

            36% {
                transform: scale(1)
            }
        }

        /*rate switch so the four radios that basically retune the entire page */
        .sr {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0
        }

        .rates {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px
        }

        .rates label {
            font: 600 11px/1 var(--mono);
            letter-spacing: .1em;
            text-transform: uppercase;
            padding: 11px 16px;
            border: 1px solid var(--line);
            border-padding: 11px 16px;
            border: 1px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
            color: var(--dim)
        }

        .rates label:hover {
            border-color: var(--oxy);
            color: var(--ink)
        }
    </style>
</head>

</html>
